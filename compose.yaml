name: sprint-amarelo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amarelo}
      POSTGRES_USER: ${POSTGRES_USER:-amarelo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amarelo}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amarelo} -d ${POSTGRES_DB:-amarelo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  s3:
    image: gresau/localstack-persist:3.8.1
    environment:
      SERVICES: s3
      PERSIST_DEFAULT: "0"
      PERSIST_S3: "1"
      PERSIST_BASE_DIR: /persisted-data/s3-state
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-test}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-test}
      S3_BUCKET: ${S3_BUCKET:-raw-data}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/persisted-data
      - ./infra/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro

  s3-backup:
    profiles: [backup]
    image: gresau/localstack-persist:3.8.1
    environment:
      SERVICES: s3
      PERSIST_DEFAULT: "0"
      PERSIST_S3: "1"
      PERSIST_BASE_DIR: /persisted-data/s3-state
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET: ${BACKUP_S3_BUCKET:-backup-data}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "4567:4566"
    volumes:
      - backup_data:/persisted-data
      - ./infra/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro

  backup:
    profiles: [backup]
    build:
      context: .
      dockerfile: infra/backup/Dockerfile
    restart: unless-stopped
    configs:
      - source: restore-map
        target: /run/configs/storage-restore-map.json
    environment:
      S3_RESTORE_MAP: /run/configs/storage-restore-map.json
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://amarelo:amarelo@postgres:5432/amarelo}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://s3:4566}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-test}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-test}
      S3_BUCKET: ${S3_BUCKET:-raw-data}
      S3_REGION: ${S3_REGION:-us-east-1}
      BACKUP_S3_ENDPOINT_URL: ${BACKUP_S3_ENDPOINT_URL:-http://s3-backup:4566}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-test}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-test}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-backup-data}
      APP_CODE_VERSION: ${APP_CODE_VERSION:-}
    depends_on:
      api:
        condition: service_healthy
      s3-backup:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: ./apps/api/.env
        required: false
    environment:
      CHAVE_API_OLHO_VIVO: ${CHAVE_API_OLHO_VIVO:-${OLHOVIVO_TOKEN:-${OLHO_VIVO_TOKEN:-}}}
      S3_RESTORE_MAP: /run/configs/storage-restore-map.json
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://amarelo:amarelo@postgres:5432/amarelo}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://s3:4566}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-test}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-test}
      S3_BUCKET: ${S3_BUCKET:-raw-data}
      S3_REGION: ${S3_REGION:-us-east-1}
    configs:
      - source: restore-map
        target: /run/configs/storage-restore-map.json
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    ports:
      - "8000:8000"

  gtfs:
    profiles: [gtfs]
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: [".venv/bin/python", "-m", "api.gtfs"]
    healthcheck:
      disable: true
    environment:
      PYTHONPATH: /workspace/apps/api/src
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://amarelo:amarelo@postgres:5432/amarelo}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://s3:4566}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-test}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-test}
      S3_BUCKET: ${S3_BUCKET:-raw-data}
      S3_REGION: ${S3_REGION:-us-east-1}
      GTFS_SOURCE_URL: ${GTFS_SOURCE_URL:-https://www.sptrans.com.br/umbraco/Surface/PerfilDesenvolvedor/BaixarGTFS}
      GTFS_SOURCE_ID: ${GTFS_SOURCE_ID:-sptrans}
      GTFS_INTERVAL_SECONDS: ${GTFS_INTERVAL_SECONDS:-86400}
      GTFS_FAILURE_INTERVAL_SECONDS: ${GTFS_FAILURE_INTERVAL_SECONDS:-300}
    depends_on:
      api:
        condition: service_healthy
      s3:
        condition: service_healthy

  collector:
    profiles: [coleta]
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: [".venv/bin/python", "-m", "api.collection"]
    healthcheck:
      disable: true
    environment:
      PYTHONPATH: /workspace/apps/api/src
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://amarelo:amarelo@postgres:5432/amarelo}
      CHAVE_API_OLHO_VIVO: ${CHAVE_API_OLHO_VIVO:-${OLHOVIVO_TOKEN:-${OLHO_VIVO_TOKEN:-}}}
      COLLECTION_INTERVAL_SECONDS: ${COLLECTION_INTERVAL_SECONDS:-30}
      GTFS_SOURCE_ID: ${GTFS_SOURCE_ID:-sptrans}
      COLLECTION_TIMEOUT_SECONDS: ${COLLECTION_TIMEOUT_SECONDS:-5}
      COLLECTION_ALERT_WEBHOOK: ${COLLECTION_ALERT_WEBHOOK:-}
      COLLECTION_ALERT_FORMAT: ${COLLECTION_ALERT_FORMAT:-generic}
    depends_on:
      api:
        condition: service_healthy

  archiver:
    profiles: [arquivo]
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: [".venv/bin/python", "-m", "api.storage", "archive", "--watch"]
    healthcheck:
      disable: true
    configs:
      - source: restore-map
        target: /run/configs/storage-restore-map.json
    environment:
      S3_RESTORE_MAP: /run/configs/storage-restore-map.json
      PYTHONPATH: /workspace/apps/api/src
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://amarelo:amarelo@postgres:5432/amarelo}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://s3:4566}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-test}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-test}
      S3_BUCKET: ${S3_BUCKET:-raw-data}
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      api:
        condition: service_healthy
      s3:
        condition: service_healthy

  reliability:
    profiles: [relatorios]
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: [".venv/bin/python", "-m", "api.reliability", "--watch"]
    healthcheck:
      disable: true
    configs:
      - source: restore-map
        target: /run/configs/storage-restore-map.json
    environment:
      S3_RESTORE_MAP: /run/configs/storage-restore-map.json
      PYTHONPATH: /workspace/apps/api/src
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://amarelo:amarelo@postgres:5432/amarelo}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://s3:4566}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-test}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-test}
      S3_BUCKET: ${S3_BUCKET:-raw-data}
      S3_REGION: ${S3_REGION:-us-east-1}
      GTFS_SOURCE_ID: ${GTFS_SOURCE_ID:-sptrans}
      COLLECTION_INTERVAL_SECONDS: ${COLLECTION_INTERVAL_SECONDS:-30}
      APP_CODE_VERSION: ${APP_CODE_VERSION:-}
    depends_on:
      api:
        condition: service_healthy
      s3:
        condition: service_healthy

  raw-publisher:
    profiles: [publicacao]
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: [".venv/bin/python", "-m", "api.exports", "--watch"]
    healthcheck:
      disable: true
    configs:
      - source: restore-map
        target: /run/configs/storage-restore-map.json
    environment:
      S3_RESTORE_MAP: /run/configs/storage-restore-map.json
      PYTHONPATH: /workspace/apps/api/src
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://amarelo:amarelo@postgres:5432/amarelo}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://s3:4566}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-test}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-test}
      S3_BUCKET: ${S3_BUCKET:-raw-data}
      S3_REGION: ${S3_REGION:-us-east-1}
      APP_CODE_VERSION: ${APP_CODE_VERSION:-}
    depends_on:
      api:
        condition: service_healthy
      s3:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
      API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"

configs:
  restore-map:
    file: ${S3_RESTORE_MAP:-./infra/storage/empty-restore-map.json}

volumes:
  postgres_data:
  localstack_data:
  backup_data:

