[project]
name = "sprint-amarelo"
version = "0.1.0"
requires-python = ">=3.13"

[tool.uv.workspace]
members = ["apps/api"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["apps/api/src", "apps/api/tests"]
exclude = ["**/__pycache__", ".venv"]
extraPaths = ["apps/api/src"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

