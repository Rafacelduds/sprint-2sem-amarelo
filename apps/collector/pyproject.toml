[project]
name = "amarelo-collector"
version = "0.1.0"
description = "Coletor de dados da Sprint Amarelo"
requires-python = ">=3.13"
dependencies = [
  "boto3>=1.41.0,<2",
  "duckdb>=1.4.1,<2",
  "pydantic-settings>=2.12.0,<3",
  "pyarrow>=22.0.0,<23",
]

[dependency-groups]
dev = [
  "boto3-stubs[s3]>=1.44.0,<2",
  "pyright>=1.1.407,<2",
  "pytest>=9.0.0,<10",
  "ruff>=0.14.5,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collector"]

