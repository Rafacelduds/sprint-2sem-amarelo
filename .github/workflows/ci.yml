name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      s3-backup:
        image: localstack/localstack:3.8
        env:
          SERVICES: s3
        ports:
          - 4567:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 5s --health-timeout 5s --health-retries 20
      s3:
        image: localstack/localstack:3.8
        env:
          SERVICES: s3
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: amarelo_test
          POSTGRES_USER: amarelo
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amarelo -d amarelo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_BACKUP_S3_ENDPOINT_URL: http://localhost:4567
      TEST_S3_ENDPOINT_URL: http://localhost:4566
      DATABASE_URL: postgresql+asyncpg://amarelo:test-only@localhost:5432/amarelo_test
      TEST_DATABASE_URL: postgresql+asyncpg://amarelo:test-only@localhost:5432/amarelo_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --all-packages --all-groups --frozen
      - run: uv run --package amarelo-api alembic -c apps/api/alembic.ini upgrade head
      - run: uv run pytest
        env:
          PG_TOOLS_CONTAINER: ${{ job.services.postgres.id }}
      - run: uv run ruff check .
      - run: uv run pyright

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint --workspace @amarelo/web
      - run: npm run build

